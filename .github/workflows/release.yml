name: Release

# Publishes the production image to GHCR on every push to main. The server's
# Watchtower polls that image and restarts the container on its own.
# ponytail: no CI gate here — main is only reached through PRs that CI already
# ran on. Gate with `workflow_run` if direct pushes to main ever start happening.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3.x

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.x
        with:
          context: .
          push: true
          # :latest is what the server follows; the sha tag is the rollback handle.
          tags: |
            ghcr.io/liukscot/world:latest
            ghcr.io/liukscot/world:${{ github.sha }}
          # Links the package to this repo on GHCR, which is also what makes the
          # package inherit the repo's public visibility.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
